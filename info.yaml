# Tiny Tapeout project information
project:
  title:        "FinQ-Chip: QEC Hardware"      # Project title
  author:       "Ionela Balint"      # Your name
  discord:      "Ionela Balint"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Quantum Error Correction module for Financial Security"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_qec_banking"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "q_0"
  ui[1]: "q_1"
  ui[2]: "q_2"
  ui[3]: "q_3"
  ui[4]: "q_4"
  ui[5]: "q_5"
  ui[6]: "q_6"
  ui[7]: "q_7"
  
  # Outputs
  uo[0]: "syn_0"
  uo[1]: "syn_1"
  uo[2]: "syn_2"
  uo[3]: "syn_3"
  uo[4]: "alert"
  uo[5]: "cnt_0"
  uo[6]: "cnt_1"
  uo[7]: "cnt_2"

  # Bidirectional pins
  uio[0]: "q_8"
  uio[1]: "q_9"
  uio[2]: "q_10"
  uio[3]: "q_11"
  uio[4]: "q_12"
  uio[5]: "q_13"
  uio[6]: "q_14"
  uio[7]: "q_15"

# Do not change!
yaml_version: 6
