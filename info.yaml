# Tiny Tapeout project information
project:
  title:        "FinQ-Chip: QEC Hardware"      # Project title
  author:       "Ionela Balint"      # Your name
  discord:      "Ionela Balint"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Quantum Error Correction module for Financial Security"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_qec_banking"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "qubit_0"
  ui[1]: "qubit_1"
  ui[2]: "qubit_2"
  ui[3]: "qubit_3"
  ui[4]: "qubit_4"
  ui[5]: "qubit_5"
  ui[6]: "qubit_6"
  ui[7]: "none"
  
  # Outputs
  uo[0]: "syndrome_0"
  uo[1]: "syndrome_1"
  uo[2]: "syndrome_2"
  uo[3]: "qldpc_alert"
  uo[4]: "count_0"
  uo[5]: "count_1"
  uo[6]: "count_2"
  uo[7]: "count_3"

  # Bidirectional pins
  uio[0]: "none"
  uio[1]: "none"
  uio[2]: "none"
  uio[3]: "none"
  uio[4]: "none"
  uio[5]: "none"
  uio[6]: "none"
  uio[7]: "none"

# Do not change!
yaml_version: 6
